# Manual, versioned releases for the whole repo: publishes app and worker
# container images to GHCR and publishes the companion CLI's
# standalone binaries (built by cli-build.yml) as a GitHub Release.
#
# Trigger it from the Actions tab after merging a version bump of
# apps/cli/package.json to the default branch. The requested tag must match
# that version — container images and CLI binaries version in lockstep.
#
# Pre-dispatch checklist: dependencies changed or fonts swapped since the last
# release? Review THIRD-PARTY-LICENSES.md (hand-maintained — nothing regenerates
# it) alongside the changelogs of anything major you bumped.
#
# This file is hand-maintained. CLI targets and asset names live in
# packages/config/src/cli.ts (CLI_PLATFORMS); the app's /api/cli/download
# endpoint serves this Release's assets — see packages/api/src/routers/cli.ts
#
# - Building on the deploy box (Dokploy Git builds)? You may not need the GHCR
#   images; the publish-containers job is safe to delete. VPS/Dokploy
#   deployments can pull the published images instead of building on the box.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.0.0. Must match apps/cli/package.json.
        required: true
        type: string
      publish_latest:
        description: Also move the GHCR latest tag to these container images.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      # Whether apps/cli/package.json exists, computed AFTER checkout. Job-level
      # `hashFiles('apps/cli/package.json')` runs before any checkout (empty
      # workspace) and is therefore always '' — the CLI jobs would never run.
      # Gate them on this output instead.
      cli_present: ${{ steps.release.outputs.cli_present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: release
        name: Validate version, branch, and image name
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run releases from the default branch. Current ref is $GITHUB_REF."
            exit 1
          fi

          tag="$VERSION"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a SemVer tag like v1.0.0."
            exit 1
          fi

          version="${tag#v}"
          if [ -f apps/cli/package.json ]; then
            cli_present=true
            cli_version="$(jq -r .version apps/cli/package.json)"
            if [ "$cli_version" != "$version" ]; then
              echo "::error::apps/cli/package.json version is $cli_version, expected $version."
              exit 1
            fi
          else
            cli_present=false
            echo "apps/cli/package.json absent (CLI removed); skipping CLI version check."
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "cli_present=$cli_present"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build CLI binaries
    needs: validate
    if: needs.validate.outputs.cli_present == 'true'
    uses: ./.github/workflows/cli-build.yml

  node-checks:
    name: Node checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full gate, not a subset: `pnpm verify` also runs the policy checks,
      # env manifest/entrypoint checks, Dockerfile COPY-list check, knip and the
      # doc-citation check; `pnpm verify:tooling` adds the policy-tooling
      # self-tests split out of `verify` (also run per-PR and nightly). A
      # release is exactly the moment those must hold. Everything both run is
      # offline and DB-free; migration integration runs on the PR PG18 service, so
      # the release runner needs nothing extra.
      - run: pnpm verify && pnpm verify:tooling
      - run: pnpm audit --audit-level=high

  # Publishes ghcr.io/<owner>/<repo> (app) and ghcr.io/<owner>/<repo>-worker.
  # Note: VITE_* values are baked into the SPA at image build time — if your
  # deployment needs them (VITE_APP_NAME etc.), pass them as build-args here or
  # keep building on the deploy platform instead (see the rebrand pattern doc).
  publish-containers:
    name: Publish ${{ matrix.name }} container
    needs:
      - validate
      - node-checks
      - build-cli
    # `build-cli` is skipped when the CLI has been removed
    # (validate.outputs.cli_present == 'false'), and a skipped `needs` job would
    # otherwise skip this one too. Keep it as a real gate instead: `always()`
    # plus explicit result checks means the CLI build and smoke tests still have
    # to pass when they run, while a CLI-free repo (where it is skipped) can
    # still publish.
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && needs.node-checks.result == 'success'
      && (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: ./Dockerfile
            suffix: ""
          - name: worker
            dockerfile: ./Dockerfile.worker
            suffix: "-worker"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: tags
        name: Compute container tags
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SUFFIX: ${{ matrix.suffix }}
          SCAN_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          image="$IMAGE$SUFFIX"
          scan_tag="release-scan-$SCAN_NAME:$GITHUB_SHA"
          {
            echo "scan_tag=$scan_tag"
            echo "release_tags<<EOF"
            echo "$image:$RELEASE_TAG"
            echo "$image:$RELEASE_VERSION"
            echo "$image:sha-$GITHUB_SHA"
            if [ "$PUBLISH_LATEST" = "true" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Passed as APT_CACHE_DATE so the base stage's `apt-get upgrade` layer is
      # rebuilt at most daily instead of being frozen in the buildx cache —
      # otherwise Trivy fails on OS patches Debian shipped after the layer was
      # first cached (see the ARG comment in the Dockerfiles). Computed once so
      # the scan build and the push build share the same layer cache.
      - name: Compute apt cache-bust date
        id: apt-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.tags.outputs.scan_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            APT_CACHE_DATE=${{ steps.apt-date.outputs.date }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          provenance: false

      - name: Reclaim ephemeral Buildx cache before Trivy
        run: |
          set -euo pipefail
          docker buildx prune -f --max-used-space 512MB || docker builder prune -f

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.release_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            APT_CACHE_DATE=${{ steps.apt-date.outputs.date }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          provenance: false

  # ── CLI GitHub Release ─────────────────────────────────────────────────────
  # Publishes the binaries + SHA256SUMS that `build-cli` produced and
  # smoke-tested. The app's /api/cli/download endpoint (CLI_RELEASE_REPO)
  # redirects installs and `cockpit-chess update` to these assets.
  publish-cli-release:
    name: Publish CLI GitHub Release
    needs:
      - validate
      - node-checks
      - publish-containers
      - build-cli
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && needs.node-checks.result == 'success'
      && needs.publish-containers.result == 'success'
      && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "$TAG" --generate-notes $prerelease dist/*

  release-summary:
    name: Release summary
    needs:
      - validate
      - publish-containers
      - publish-cli-release
    if: ${{ always() && needs.publish-containers.result == 'success' && needs.publish-cli-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Release ${{ needs.validate.outputs.tag }}"
            echo
            echo "- App container: \`${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.tag }}\`"
            echo "- Worker container: \`${{ needs.validate.outputs.image }}-worker:${{ needs.validate.outputs.tag }}\`"
            echo "- CLI artifacts: GitHub Release \`${{ needs.validate.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
