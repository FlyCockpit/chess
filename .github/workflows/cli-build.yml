# Builds the companion CLI (`apps/cli`) into standalone binaries and proves
# each one runs on its real OS. Reusable: pr-checks.yml calls it on PRs that
# touch the CLI (required by `PR validation`), cli-ci.yml on pushes,
# release.yml calls it before publishing a GitHub Release.
#
#   compile   ubuntu: `bun build --compile` cross-compiles every target
#   sign      macOS:  ad-hoc signs the darwin binaries (Apple Silicon refuses
#                     unsigned code) and writes SHA256SUMS over the final bytes
#   smoke     runs each binary on Linux x64/arm64, macOS arm64, and Windows
#
# Output: the `cli-binaries` artifact — the five binaries plus SHA256SUMS,
# named per CLI_PLATFORMS in packages/config/src/cli.ts (the names the app's
# /api/cli/download endpoint and install scripts expect).
#
# Bun is used ONLY here. Developers run the CLI with pnpm/tsx; the binary
# embeds the Bun runtime, so users need neither Node nor Bun.
name: CLI build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    name: Compile binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read CLI version
        id: version
        run: node -p "'version=' + require('./apps/cli/package.json').version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # 1.4.4 bundles NSS 3.131.1 roots and rejects the compromised eMudhra
          # keys (CVE-2026-111943); the compiled CLI embeds Bun's CA store.
          bun-version: 1.4.4
      # The built-in default (production) server, from the repository
      # variable COCKPIT_CHESS_DEFAULT_SERVER (Settings → Secrets and variables →
      # Actions → Variables). Unset builds a binary with no default; users
      # then get the server from the install script.
      - run: pnpm --filter @cockpit-chess/cli compile
        env:
          COCKPIT_CHESS_DEFAULT_SERVER: ${{ vars.COCKPIT_CHESS_DEFAULT_SERVER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-unsigned
          path: apps/cli/dist/
          if-no-files-found: error

  sign:
    name: Sign macOS binaries and write checksums
    needs: compile
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-unsigned
          path: dist
      # Ad-hoc signature: enough for Gatekeeper to let a curl/gh-downloaded
      # binary run (no quarantine flag). Browser downloads additionally need
      # Developer ID signing + notarization (not configured here).
      - name: Ad-hoc sign darwin binaries
        working-directory: dist
        run: |
          for f in cockpit-chess-darwin-*; do
            codesign --force --sign - "$f"
            codesign --verify --verbose "$f"
          done
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 cockpit-chess-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.asset }})
    needs: [compile, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: cockpit-chess-linux-x64 }
          # GitHub has no `ubuntu-latest` label for arm64, so this lane names
          # the newest GA arm64 image explicitly (Ubuntu 26.04).
          - { os: ubuntu-26.04-arm, asset: cockpit-chess-linux-arm64 }
          - { os: macos-latest, asset: cockpit-chess-darwin-arm64 }
          - { os: windows-latest, asset: cockpit-chess-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: |
          expected="$(awk -v n="${{ matrix.asset }}" '$2 == n { print $1 }' SHA256SUMS)"
          actual="$( (sha256sum "${{ matrix.asset }}" 2>/dev/null || shasum -a 256 "${{ matrix.asset }}") | awk '{ print $1 }')"
          test -n "$expected" && test "$expected" = "$actual"
      - name: Run the binary
        working-directory: dist
        env:
          COCKPIT_CHESS_CONFIG_DIR: ${{ runner.temp }}/cockpit-chess-config
          EXPECTED_CLI_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          chmod +x "${{ matrix.asset }}"
          bin="./${{ matrix.asset }}"
          actual_version="$("$bin" --version | tr -d '\r')"
          test -n "$EXPECTED_CLI_VERSION"
          test "$actual_version" = "$EXPECTED_CLI_VERSION"
          "$bin" --help
          "$bin" config path
          # Not signed in: must fail with the documented exit code, not crash.
          set +e
          "$bin" whoami --server https://example.invalid
          code=$?
          set -e
          test "$code" -eq 4
      - name: Serve the embedded browser lab
        working-directory: dist
        env:
          COCKPIT_CHESS_CONFIG_DIR: ${{ runner.temp }}/cockpit-chess-config
        run: |
          # This job only downloads binaries: no checkout or web assets exist.
          "./${{ matrix.asset }}" serve --port 0 > local-url.txt 2> local-serve.log &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true; wait "$serve_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if test -s local-url.txt; then break; fi
            if ! kill -0 "$serve_pid" 2>/dev/null; then cat local-serve.log; exit 1; fi
            sleep 1
          done
          url="$(tr -d '\r\n' < local-url.txt)"
          test -n "$url"
          origin="${url%/en-US/}"
          curl --fail --silent --show-error "$origin/" -o local.html
          asset="$(sed -n 's/.*<script[^>]*src="\([^"]*\)".*/\1/p' local.html | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error -D asset-headers.txt "$origin$asset" -o local-asset.js
          test -s local-asset.js
          grep -iq 'content-type: text/javascript' asset-headers.txt
